<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#08080a">
<title>desktop</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23000'/><text x='16' y='24' font-size='26' fill='%23ff2b2b' text-anchor='middle' font-family='monospace'>!</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  width:100%;height:100%;overflow:hidden;background:#08080a;
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  user-select:none;-webkit-user-select:none;cursor:default;color:#ddd;
  position:fixed;inset:0;
  padding: env(safe-area-inset-top) env(safe-area-inset-right)
           env(safe-area-inset-bottom) env(safe-area-inset-left);
}
@keyframes blink{50%{opacity:0}}
@keyframes tapPulse{0%,100%{opacity:.25}50%{opacity:.7}}
@keyframes pulseBorder{0%,100%{box-shadow:0 0 0 0 rgba(255,43,43,.7)}50%{box-shadow:0 0 0 10px rgba(255,43,43,0)}}
@keyframes waveAnim{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes phoneShake{
  0%,100%{transform:translate(0,0) rotate(0)}
  20%{transform:translate(-2px,1px) rotate(-.3deg)}
  40%{transform:translate(2px,-1px) rotate(.3deg)}
  60%{transform:translate(-2px,-1px) rotate(-.2deg)}
  80%{transform:translate(2px,1px) rotate(.2deg)}
}
@keyframes warnIn{
  0%{opacity:0;transform:scale(.5)}
  60%{opacity:1;transform:scale(1.08)}
  100%{opacity:1;transform:scale(1)}
}
@keyframes warnPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,43,43,.75), 0 0 22px rgba(255,43,43,.55)}
  50%{box-shadow:0 0 0 10px rgba(255,43,43,0), 0 0 30px rgba(255,43,43,.85)}
}
@keyframes warnCritical{
  0%,100%{box-shadow:0 0 0 0 rgba(255,43,43,.9), 0 0 30px rgba(255,43,43,.85), inset 0 0 20px rgba(255,43,43,.4)}
  50%{box-shadow:0 0 0 14px rgba(255,43,43,0), 0 0 40px rgba(255,43,43,1), inset 0 0 30px rgba(255,43,43,.6)}
}
@keyframes finalRedFlash{
  0%{background:rgba(0,0,0,.88)}
  50%{background:rgba(80,0,0,.95)}
  100%{background:rgba(0,0,0,.88)}
}
@keyframes appShake{
  0%,100%{transform:translate(0,0)}
  25%{transform:translate(-2px,1px)}
  75%{transform:translate(2px,-1px)}
}
@keyframes toastIn{
  0%{opacity:0;transform:translate(-50%,-16px)}
  100%{opacity:1;transform:translate(-50%,0)}
}
@keyframes optIn{
  0%{opacity:0;transform:translateY(8px)}
  100%{opacity:1;transform:none}
}

.cursor{display:inline-block;width:8px;height:16px;background:#ff2b2b;vertical-align:-2px;animation:blink 1s step-end infinite}

/* 名字 */
#name-screen{
  position:fixed;inset:0;z-index:10100;background:#050506;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 24px;gap:28px;transition:opacity .8s;
}
#name-screen.fade{opacity:0;pointer-events:none}
#name-line1,#name-line2{
  font-family:"SF Mono","Consolas",monospace;
  font-size:16px;color:#b8b8b8;letter-spacing:.5px;
  min-height:22px;text-align:center;line-height:1.8;
}
#name-input-wrap{
  display:flex;align-items:center;gap:0;
  border-bottom:1px solid rgba(255,255,255,.22);
  padding-bottom:4px;min-width:200px;
  opacity:0;transition:opacity .6s;
}
#name-input-wrap.show{opacity:1}
#name-input{
  flex:1;background:transparent;border:0;outline:0;color:#fff;
  font-size:20px;text-align:center;letter-spacing:4px;
  font-family:"SF Mono","Consolas",monospace;padding:8px 4px;
  min-width:0;
}
#name-input::placeholder{color:#333;letter-spacing:2px;font-size:16px}
#name-confirm{
  margin-top:4px;padding:12px 32px;border:1px solid rgba(255,43,43,.4);
  background:transparent;color:#ff5c5c;border-radius:6px;
  font-family:"SF Mono","Consolas",monospace;font-size:14px;
  letter-spacing:4px;cursor:pointer;opacity:0;transition:opacity .6s,background .15s;
}
#name-confirm.show{opacity:1}
#name-confirm:active{background:rgba(255,43,43,.12)}
#name-confirm:disabled{opacity:.15;cursor:not-allowed}

/* 独白 */
#monologue{
  position:fixed;inset:0;z-index:10090;background:#050506;
  display:none;align-items:center;justify-content:center;
  padding:40px 28px;transition:opacity .8s;
}
#monologue.active{display:flex}
#monologue.fade{opacity:0;pointer-events:none}
#monologue-text{
  max-width:520px;width:100%;
  font-family:"SF Mono","Consolas","Courier New",monospace;
  font-size:15px;line-height:2;color:#d0d0d0;letter-spacing:.3px;
  white-space:pre-wrap;word-break:break-word;
}
#mono-skip{
  position:absolute;top:40px;right:20px;
  padding:8px 14px;border-radius:16px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.2);
  color:#ccc;font-size:13px;letter-spacing:1px;
  cursor:pointer;user-select:none;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  z-index:5;
}
#mono-skip:active{background:rgba(255,255,255,.18)}

/* iOS 手机 */
#phone{
  position:fixed;inset:0;z-index:10000;background:#f2f2f7;
  display:none;flex-direction:column;color:#111;
  transition:background .8s;
}
#phone.active{display:flex}
#phone.corrupted{background:#0a0a0c;color:#ddd}
#phone.shaking{animation:phoneShake .5s}

#phone-statusbar{
  height:34px;background:transparent;display:flex;align-items:center;
  padding:0 20px;font-size:13px;font-weight:600;color:#111;
  justify-content:space-between;flex-shrink:0;position:relative;z-index:3;
  transition:color .8s;
}
#phone.corrupted #phone-statusbar{color:#ff5c5c}
#phone-statusbar .left{display:flex;gap:5px;align-items:center}
#phone-statusbar .right{display:flex;gap:6px;align-items:center}
.sig-bar{display:inline-flex;gap:1px;align-items:flex-end;height:11px}
.sig-bar i{width:3px;background:currentColor;border-radius:.5px;display:block}
.sig-bar i:nth-child(1){height:3px}
.sig-bar i:nth-child(2){height:5px}
.sig-bar i:nth-child(3){height:7px}
.sig-bar i:nth-child(4){height:9px}
.battery{
  width:22px;height:11px;border:1px solid currentColor;border-radius:2px;
  position:relative;display:inline-block;
}
.battery::after{
  content:'';position:absolute;top:2px;right:-3px;
  width:1.5px;height:5px;background:currentColor;border-radius:0 1px 1px 0;
}
.battery i{position:absolute;top:1.5px;left:1.5px;bottom:1.5px;
  background:currentColor;border-radius:1px;width:70%}

#phone-topbar{
  height:48px;background:rgba(255,255,255,.94);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  display:flex;align-items:center;padding:0 12px;gap:10px;
  border-bottom:.5px solid rgba(0,0,0,.1);flex-shrink:0;z-index:3;
  transition:background .8s,border-color .8s;position:relative;
}
#phone.corrupted #phone-topbar{
  background:rgba(15,15,18,.94);
  border-bottom-color:rgba(255,43,43,.35);
}
.back-arrow{
  color:#007aff;font-size:22px;font-weight:400;
  padding:0 4px;cursor:pointer;transition:color .8s;line-height:1;
}
#phone.corrupted .back-arrow{color:#ff5c5c}
.contact{
  flex:1;text-align:center;font-size:16px;font-weight:600;color:#111;
  transition:color .8s;position:relative;
}
#phone.corrupted .contact{color:#ff5c5c}
.contact .avatar{
  display:inline-block;width:26px;height:26px;border-radius:50%;
  background:#c4c4c8;color:#fff;font-size:13px;font-weight:600;
  line-height:26px;text-align:center;margin-right:6px;
  vertical-align:middle;transition:background .8s;
}
#phone.corrupted .contact .avatar{background:#ff2b2b}

#top-actions{
  position:absolute;top:40px;right:14px;z-index:10060;
  display:none;gap:8px;
}
#top-actions.show{display:flex}
.top-btn{
  padding:6px 12px;border-radius:14px;
  background:rgba(0,0,0,.5);color:#fff;
  font-size:12px;letter-spacing:.5px;
  cursor:pointer;user-select:none;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  white-space:nowrap;
}
.top-btn:active{background:rgba(0,0,0,.75)}
.top-btn.playing{background:rgba(52,199,89,.7)}
#phone.corrupted .top-btn{background:rgba(255,43,43,.5)}
#phone.corrupted .top-btn.playing{background:rgba(255,43,43,.75)}

#phone-chat{
  flex:1;overflow-y:auto;padding:14px 12px 12px;
  background:#f2f2f7;transition:background .8s;
  scroll-behavior:smooth;
}
#phone.corrupted #phone-chat{background:#0a0a0c}

.time-divider{
  text-align:center;font-size:10px;color:#8e8e93;
  margin:14px 0 8px;letter-spacing:.5px;
  font-family:"SF Mono","Consolas",monospace;
}

.msg{
  display:flex;margin-bottom:8px;opacity:0;transform:translateY(6px);
  transition:opacity .35s,transform .35s;
}
.msg.show{opacity:1;transform:none}
.msg.me{justify-content:flex-end}
.bubble-msg{
  max-width:74%;padding:9px 13px;border-radius:16px;font-size:14px;
  line-height:1.5;word-break:break-word;position:relative;
  transition:background .8s,color .8s;
}
.msg.you .bubble-msg{
  background:#fff;color:#111;border-bottom-left-radius:4px;
}
.msg.me .bubble-msg{
  background:#34c759;color:#fff;border-bottom-right-radius:4px;
}
#phone.corrupted .msg.you .bubble-msg{background:#1c1c22;color:#e8e8e8}
#phone.corrupted .msg.me .bubble-msg{background:#3a0d0d;color:#ff8b8b}

.msg.special{justify-content:flex-start}
.special-card{
  max-width:76%;padding:10px 13px;border-radius:14px;
  background:#fff;color:#111;font-size:13px;line-height:1.6;
  cursor:pointer;transition:background .15s,border-color .8s;
  border:1px solid rgba(0,0,0,.05);position:relative;
  display:flex;align-items:center;gap:10px;
}
.special-card:active{background:#f0f0f4}
.special-card .obj-icon{
  width:34px;height:34px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;background:#f2f2f7;
}
.special-card .obj-info{flex:1;min-width:0}
.special-card .obj-label{color:#8e8e93;font-size:11px;margin-bottom:2px}
.special-card .obj-main{font-weight:500;color:#111;font-size:14px}
.special-card .obj-sub{color:#8e8e93;font-size:11px;margin-top:2px}
#phone.corrupted .special-card{
  background:#15151a;color:#e8e8e8;border-color:rgba(255,43,43,.35);
}
#phone.corrupted .special-card .obj-icon{background:#2a1010}
#phone.corrupted .special-card .obj-label{color:#ff5c5c}
#phone.corrupted .special-card .obj-main{color:#ff8b8b}
#phone.corrupted .special-card .obj-sub{color:#a05a5a}

#phone-input-bar{
  padding:10px 12px;background:rgba(255,255,255,.94);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:.5px solid rgba(0,0,0,.1);
  display:none;align-items:center;gap:8px;flex-shrink:0;
  transition:background .8s,border-color .8s;
}
#phone-input-bar.active{display:flex}
#phone.corrupted #phone-input-bar{
  background:rgba(15,15,18,.94);border-top-color:rgba(255,43,43,.35);
}
#phone-draft{
  flex:1;background:#fff;border:1px solid rgba(0,0,0,.08);
  border-radius:18px;padding:9px 14px;font-size:14px;color:#111;
  font-family:inherit;outline:0;
}
#phone-draft.filled{border-color:#34c759}
#phone.corrupted #phone-draft{
  background:#1c1c22;color:#ff8b8b;border-color:rgba(255,43,43,.35);
}
#phone-send{
  background:#34c759;color:#fff;border:0;border-radius:18px;
  padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;
  opacity:.4;transition:opacity .2s,background .8s;
}
#phone-send.ready{opacity:1}
#phone-send:active{background:#28a745}
#phone.corrupted #phone-send{background:#ff2b2b;opacity:1}

#tap-hint{
  position:absolute;bottom:22%;left:50%;transform:translateX(-50%);
  color:#8e8e93;font-size:12px;letter-spacing:2px;
  animation:tapPulse 2s infinite;pointer-events:none;
  z-index:5;white-space:nowrap;
}
#phone.corrupted #tap-hint{color:#ff5c5c}

#drawer{
  position:fixed;left:0;right:0;bottom:0;z-index:10050;
  background:#fff;border-radius:16px 16px 0 0;
  padding:20px 20px 30px;transform:translateY(100%);
  transition:transform .35s cubic-bezier(.32,.72,0,1);
  box-shadow:0 -10px 40px rgba(0,0,0,.2);
  max-height:78vh;overflow-y:auto;
}
#drawer.open{transform:translateY(0)}
#drawer .drawer-handle{
  width:36px;height:4px;background:#d0d0d5;border-radius:2px;
  margin:0 auto 16px;
}
#drawer h3{font-size:16px;font-weight:600;color:#111;margin-bottom:14px;text-align:center;}
#drawer .amount{font-size:38px;font-weight:300;color:#111;letter-spacing:-1px;text-align:center;margin:10px 0 6px;}
#drawer .amount-sub{font-size:13px;color:#8e8e93;text-align:center;margin-bottom:20px;}
#drawer .note{background:#f2f2f7;border-radius:10px;padding:12px;font-size:13px;color:#333;text-align:left;margin-top:12px;line-height:1.8;}
#drawer .file-paper{background:linear-gradient(#fdfaf3,#f8f2e2);border:1px solid #e8ddb8;border-radius:8px;padding:20px 18px;margin:8px 0;font-family:"Kaiti SC","STKaiti",serif;font-size:14px;color:#333;line-height:2;text-align:left;}
#drawer .voice{display:flex;align-items:center;gap:12px;background:#f2f2f7;border-radius:12px;padding:14px;margin:10px 0;}
#drawer .voice .wave{flex:1;height:30px;display:flex;align-items:center;gap:2px;}
#drawer .voice .wave i{flex:1;background:#34c759;border-radius:1px;height:100%;animation:waveAnim 1.2s infinite ease-in-out;}
#drawer .voice-text{font-size:13px;color:#333;line-height:1.9;background:#f2f2f7;border-radius:10px;padding:12px;margin-top:10px;text-align:left;font-style:italic;}
#drawer .call-log{display:flex;flex-direction:column;gap:8px;background:#f2f2f7;border-radius:12px;padding:14px;margin:10px 0;}
#drawer .call-log .row{display:flex;justify-content:space-between;font-size:13px;color:#333;}
#drawer .call-log .row span:first-child{color:#8e8e93}
#drawer .sticker-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0;}
#drawer .sticker-grid .sk{background:#f2f2f7;border-radius:12px;padding:14px 8px;text-align:center;}
#drawer .sticker-grid .sk .emo{font-size:38px}
#drawer .sticker-grid .sk .cap{font-size:11px;color:#8e8e93;margin-top:6px}
#drawer .sticker-grid .sk .count{font-size:10px;color:#c41e2c;margin-top:4px}
#drawer-close{display:block;width:100%;margin-top:18px;padding:13px;border:0;background:#f2f2f7;color:#007aff;font-size:15px;font-weight:500;border-radius:10px;cursor:pointer;font-family:inherit;}
#drawer-close:active{background:#e5e5ea}
#drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10040;opacity:0;pointer-events:none;transition:opacity .35s;}
#drawer-backdrop.open{opacity:1;pointer-events:auto}

/* 警告弹窗 */
#warn-layer{position:fixed;inset:0;z-index:10080;display:none;overflow:hidden;background:rgba(0,0,0,.88);}
#warn-layer.active{display:block}
#warn-layer.black{background:#000}
#warn-layer.final{animation:finalRedFlash .6s 3}

.warn-box{position:absolute;width:170px;height:150px;background:linear-gradient(180deg, #1a1a20 0%, #0d0d12 100%);border:2.5px solid #ff2b2b;border-radius:8px;padding:12px 10px;color:#e8e8e8;font-family:"SF Mono","Consolas",monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:warnIn .28s cubic-bezier(.34,1.56,.64,1), warnPulse 1.6s infinite;box-shadow:0 0 0 1px rgba(255,43,43,.3), 0 0 22px rgba(255,43,43,.55);}
.warn-box .warn-icon{width:34px;height:34px;border-radius:50%;background:rgba(255,43,43,.28);border:2.5px solid #ff2b2b;color:#ff2b2b;font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 16px rgba(255,43,43,.9), inset 0 0 8px rgba(255,43,43,.5);margin-bottom:8px;text-shadow:0 0 10px rgba(255,43,43,1);}
.warn-box .warn-title{color:#ff5c5c;font-size:16px;font-weight:900;letter-spacing:1.5px;line-height:1.3;text-shadow:0 0 8px rgba(255,43,43,.9);margin-bottom:6px;}
.warn-box .warn-body{color:#e8e8e8;font-size:15px;font-weight:700;letter-spacing:.8px;line-height:1.4;text-shadow:0 0 4px rgba(0,0,0,.9);}
.warn-box.critical{background:linear-gradient(180deg, #2a0808 0%, #140404 100%);border-color:#ff1744;animation:warnIn .28s cubic-bezier(.34,1.56,.64,1), warnCritical 1.2s infinite;}
.warn-box.critical .warn-icon{background:rgba(255,23,68,.4);border-color:#ff1744;box-shadow:0 0 20px rgba(255,23,68,1), inset 0 0 8px rgba(255,23,68,.7);}
.warn-box.critical .warn-title{color:#ff1744;text-shadow:0 0 12px rgba(255,23,68,1);}
.warn-box.critical .warn-body{color:#ff8b8b;}

/* 桌面 */
#desktop{position:fixed;inset:52px 0 60px 0;background:radial-gradient(circle at 40% 20%,#17171f 0%,#08080a 72%);display:none;padding:16px 12px;overflow:hidden;}
#desktop.active{display:block}
.icon-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 8px}
.icon{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px;border-radius:8px;cursor:pointer;transition:transform .1s;}
.icon:active{transform:scale(.96)}
.icon.locked .glyph{filter:grayscale(.4) brightness(.85);box-shadow:0 6px 16px rgba(0,0,0,.55), inset 0 0 0 1.5px rgba(255,43,43,.4);}
.icon .glyph{width:52px;height:52px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.55);}
.icon .label{font-size:11px;color:#cfcfcf;text-shadow:0 1px 3px #000;text-align:center;line-height:1.2;}
.icon.locked .label{color:#8a5555}
.icon.unlocked .glyph{filter:none;box-shadow:0 6px 16px rgba(0,0,0,.55), 0 0 0 2px rgba(255,43,43,.9);animation:pulseBorder 1.6s infinite;}
.icon.unlocked .label{color:#ff5c5c;font-weight:600}
.icon.done .glyph{filter:none;box-shadow:0 6px 16px rgba(0,0,0,.55), 0 0 0 2px rgba(136,224,160,.6);}
.icon.done .label{color:#88e0a0}
.g-wechat{background:#07c160}.g-qq{background:#12b7f5}
.g-weibo{background:#e6162d}.g-mail{background:#2b6cb0}
.g-browser{background:#3d4451}

#taskbar{position:fixed;left:0;right:0;bottom:0;height:60px;z-index:500;background:rgba(18,18,24,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.06);display:none;align-items:center;padding:0 12px;gap:6px;}
#taskbar.active{display:flex}
.tb-item{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;opacity:.5;}
#clock{margin-left:auto;color:#9a9a9a;font-size:12px;letter-spacing:.6px}

#blackout{position:fixed;inset:0;z-index:10200;background:#000;opacity:0;pointer-events:none;transition:opacity 1.2s;}
#blackout.on{opacity:1;pointer-events:auto}

#sys-toast-layer{position:fixed;left:0;right:0;top:20px;z-index:99999;pointer-events:none;display:flex;justify-content:center;opacity:0;transition:opacity .3s;}
#sys-toast-layer.show{opacity:1}
.sys-toast{max-width:88vw;background:rgba(30,10,10,.98);border:2px solid #ff2b2b;border-radius:12px;padding:14px 18px;color:#fff;font-size:15px;font-weight:600;line-height:1.5;text-align:center;box-shadow:0 0 24px rgba(255,43,43,.85), 0 10px 30px rgba(0,0,0,.7);animation:toastIn .25s ease-out;}
.sys-toast .t-icon{color:#ff5c5c;margin-right:8px;font-weight:900;font-size:17px;}

/* 微信 App */
#wechat-app{position:fixed;inset:0;z-index:10100;background:#f2f2f7;display:none;flex-direction:column;color:#111;}
#wechat-app.active{display:flex}
#wechat-app.shaking{animation:appShake .5s}

/* ============ 结局：Cents 接管 ============ */
#cents-end{
  position:fixed;inset:0;z-index:10300;
  background:#050506;display:none;
  align-items:center;justify-content:center;
  padding:40px 24px;overflow:hidden;
}
#cents-end.active{display:flex}
#cents-end .ce-bg{
  position:absolute;inset:0;
  background:radial-gradient(circle at 50% 40%, rgba(120,0,0,.22) 0%, rgba(0,0,0,0) 62%);
  animation:ceBgPulse 2.6s ease-in-out infinite;
}
@keyframes ceBgPulse{
  0%,100%{opacity:.55;transform:scale(1)}
  50%{opacity:1;transform:scale(1.06)}
}
#cents-end .ce-scan{
  position:absolute;inset:0;
  background:repeating-linear-gradient(180deg, rgba(255,43,43,.05) 0 1px, transparent 1px 4px);
  pointer-events:none;opacity:.5;
}
#cents-end .ce-inner{
  position:relative;z-index:2;
  width:100%;max-width:520px;
  display:flex;flex-direction:column;align-items:center;
  gap:26px;text-align:center;
}
.ce-mark{
  width:96px;height:96px;border-radius:22px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#1a0505 0%,#0a0202 100%);
  border:2px solid #ff2b2b;
  box-shadow:0 0 30px rgba(255,43,43,.85), inset 0 0 22px rgba(255,43,43,.35);
  position:relative;
  animation:ceMarkPulse 1.8s ease-in-out infinite;
}
@keyframes ceMarkPulse{
  0%,100%{box-shadow:0 0 24px rgba(255,43,43,.7), inset 0 0 18px rgba(255,43,43,.28)}
  50%{box-shadow:0 0 46px rgba(255,43,43,1), inset 0 0 30px rgba(255,43,43,.5)}
}
.ce-mark .ce-c{
  font-family:"SF Mono","Consolas",monospace;
  font-size:54px;font-weight:900;color:#ff2b2b;
  text-shadow:0 0 18px rgba(255,43,43,1), 0 0 42px rgba(255,43,43,.7);
  line-height:1;
  animation:ceCPulse 1.8s ease-in-out infinite;
}
@keyframes ceCPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.06)}
}
.ce-mark::after{
  content:'';position:absolute;inset:-8px;border-radius:26px;
  border:1px dashed rgba(255,43,43,.4);
  animation:ceSpin 9s linear infinite;
}
@keyframes ceSpin{to{transform:rotate(360deg)}}

.ce-title{
  font-family:"SF Mono","Consolas",monospace;
  font-size:20px;letter-spacing:4px;color:#ff5c5c;
  text-shadow:0 0 12px rgba(255,43,43,.9);
}
.ce-sub{
  font-family:"SF Mono","Consolas",monospace;
  font-size:11px;letter-spacing:3px;color:#8a3a3a;
}
.ce-lines{
  font-family:"SF Mono","Consolas","Courier New",monospace;
  font-size:19px;line-height:2.1;color:#f0f0f0;
  min-height:210px;white-space:pre-wrap;
  text-shadow:0 0 10px rgba(255,43,43,.35);
}
.ce-lines .name{
  font-size:23px;color:#ff5c5c;
  text-shadow:0 0 16px rgba(255,43,43,.95);
  display:block;margin-bottom:10px;letter-spacing:2px;
}
.ce-actions{
  display:none;gap:18px;margin-top:6px;
}
.ce-actions.show{display:flex}
.ce-btn{
  min-width:112px;padding:14px 30px;border-radius:10px;
  font-family:"SF Mono","Consolas",monospace;
  font-size:16px;letter-spacing:4px;cursor:pointer;
  border:1.5px solid #ff2b2b;background:rgba(255,43,43,.08);
  color:#ff5c5c;transition:background .15s,transform .12s;
}
.ce-btn:active{background:rgba(255,43,43,.28)}
.ce-btn.good{
  background:rgba(255,43,43,.9);color:#fff;
  box-shadow:0 0 26px rgba(255,43,43,.9);
  animation:ceGoodPulse 1.6s ease-in-out infinite;
}
@keyframes ceGoodPulse{
  0%,100%{box-shadow:0 0 20px rgba(255,43,43,.75)}
  50%{box-shadow:0 0 42px rgba(255,43,43,1)}
}
.ce-btn.bad{
  background:rgba(255,255,255,.04);
  border-color:rgba(255,43,43,.35);color:#a05a5a;
}
.ce-btn-wrap{
  position:relative;display:flex;align-items:center;justify-content:center;
  gap:20px;width:100%;min-height:52px;
}
/* "不好"按钮：只在被点击后才脱离文档流飞走 */
.ce-btn.bad.escape{
  position:fixed;
  z-index:10500;
  transition:left .18s cubic-bezier(.34,1.4,.64,1),
             top  .18s cubic-bezier(.34,1.4,.64,1),
             transform .18s ease, opacity .3s;
  will-change:left,top,transform;
}

  font-family:"SF Mono","Consolas",monospace;

}
#ce-celebrate.active{display:flex}
#ce-canvas{position:absolute;inset:0;width:100%;height:100%}
.ce-cel-text{
  position:relative;z-index:3;
  font-family:"SF Mono","Consolas",monospace;
  text-align:center;color:#fff;letter-spacing:3px;
  opacity:0;transform:scale(.86);
  transition:opacity .5s,transform .5s;
}
.ce-cel-text.show{opacity:1;transform:scale(1)}
.ce-cel-text .big{
  font-size:34px;font-weight:900;color:#ff2b2b;
  text-shadow:0 0 24px rgba(255,43,43,1);
  animation:ceHeartbeat 1.1s ease-in-out infinite;
  display:block;margin-bottom:14px;letter-spacing:5px;
}
.ce-cel-text .small{font-size:14px;color:#ff8b8b;letter-spacing:4px}
@keyframes ceHeartbeat{
  0%,100%{transform:scale(1)}
  14%{transform:scale(1.1)}
  28%{transform:scale(1)}
  42%{transform:scale(1.08)}
  56%{transform:scale(1)}
}

/* 全局跳过按钮 */
#global-skip{

const Audio_ = {
  ctx: null, master: null,
  init() {
    if (!this.ctx) {
      try {
        this.ctx = new (window.AudioContext||window.webkitAudioContext)();
        this.master = this.ctx.createGain();
        this.master.gain.value = 1;
        this.master.connect(this.ctx.destination);
      } catch(e) {}
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(type, f1, f2, dur, vol) {
    this.init(); if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, now);
    if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(Math.max(1,f2), now + dur);
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.connect(g).connect(this.master);
    o.start(now); o.stop(now + dur + 0.02);
  },
  click() { this.tone('triangle', 1500, 900, 0.055, 0.045); setTimeout(() => this.tone('square', 2400, 1800, 0.02, 0.02), 8); },
  popYou() { this.tone('sine', 540, 380, 0.12, 0.05); },
  popMe() { this.tone('sine', 880, 640, 0.09, 0.045); },
  popSys() { this.tone('triangle', 380, 320, 0.1, 0.035); },
  key() { this.tone('square', 950 + Math.random()*200, 900, 0.015, 0.012); },
  warnCircle(step) {
    const base = 180 - step * 18;
    this.tone('sine', base, base * 0.55, 0.45, 0.09);
    setTimeout(() => this.tone('sine', base*0.7, base*0.4, 0.3, 0.05), 60);
  },
  finalHit() {
    this.tone('sawtooth', 65, 38, 1.4, 0.12);
    setTimeout(() => this.tone('square', 420, 420, 0.16, 0.06), 300);
    setTimeout(() => this.tone('square', 420, 420, 0.16, 0.06), 520);
    setTimeout(() => this.tone('square', 420, 420, 0.16, 0.06), 740);
    setTimeout(() => this.tone('square', 800 + Math.random()*400, 200, 0.12, 0.05), 1000);
    setTimeout(() => this.tone('square', 1000 + Math.random()*400, 300, 0.1, 0.05), 1120);
  },
  heartbeat(vol=0.08) {
    this.init(); if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(120, now);
    o.frequency.exponentialRampToValueAtTime(45, now + 0.18);
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
    o.connect(g).connect(this.master);
    o.start(now); o.stop(now + 0.3);
  },
  alertHit() {
    this.tone('square', 800, 300, 0.12, 0.07);
    setTimeout(() => this.tone('square', 600, 200, 0.15, 0.07), 130);
  },
  askPop() {
    this.tone('sawtooth', 240, 120, 0.25, 0.08);
    setTimeout(() => this.tone('sine', 900, 400, 0.2, 0.05), 50);
  },
  wrong() {
    this.tone('square', 200, 100, 0.2, 0.08);
    setTimeout(() => this.tone('square', 180, 80, 0.2, 0.07), 180);
  },
  right() {
    this.tone('sine', 660, 990, 0.15, 0.05);
    setTimeout(() => this.tone('sine', 880, 1320, 0.2, 0.05), 120);
  },
  blip(freq=880, dur=.06, vol=.04) { this.tone('sine', freq, freq*0.8, dur, vol); },
  thud() { this.heartbeat(0.08); },
  takeover() {
    this.tone('sawtooth', 90, 45, 2.0, 0.11);
    setTimeout(() => this.tone('square', 55, 30, 2.4, 0.07), 120);
  },
  celebrate() {
    const notes = [330, 415, 495, 660, 830, 990];
    notes.forEach((f, i) => {
      setTimeout(() => this.tone('triangle', f, f*1.5, 0.22, 0.055), i*110);
    });
    setTimeout(() => this.tone('sine', 60, 40, 0.5, 0.1), 0);
    setTimeout(() => this.tone('sine', 60, 40, 0.5, 0.1), 380);
    setTimeout(() => this.tone('sine', 60, 40, 0.6, 0.1), 760);
  }
};

async function typeText(el, text, speed=80) {
  el.innerHTML = '';
  const cur = document.createElement('span');
  cur.className = 'cursor';
  el.appendChild(cur);
  for (let i=0;i<text.length;i++) {
    cur.insertAdjacentText('beforebegin', text[i]);
    if (text[i] !== ' ' && Math.random() < .4) Audio_.key();
    let d = speed + Math.random()*30;
    if ('，。！？、；：'.includes(text[i])) d += 260;
    if (text[i] === '\n') d += 200;
    await sleep(d);
  }
  cur.remove();
}
async function startNameScreen() {
  await sleep(600);
  await typeText(nameLine1, '在开始之前……', 110);
  await sleep(900);

  await sleep(400);
  nameWrap.classList.add('show');
  nameConfirm.classList.add('show');
  nameInput.focus();
}
nameInput.addEventListener('input', () => {
  nameConfirm.disabled = nameInput.value.trim().length === 0;
  Audio_.key();
});
nameInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !nameConfirm.disabled) { e.preventDefault(); confirmName(); }
});
nameConfirm.addEventListener('click', confirmName);
async function confirmName() {
  const n = nameInput.value.trim();

  STATE.playerName = n;
  Audio_.thud();
  nameScreen.classList.add('fade');
  await sleep(800);

  startMonologue();
}

    if (monoSkip) { cur.remove(); return; }

    if (text[i] !== ' ' && Math.random() < .35) Audio_.key();

function startPhone() {

function updateTapHint() {
  if (phoneFinished) { tapHint.style.display = 'none'; return; }
  if (waitingForObject) tapHint.textContent = '点 开 它';
  else tapHint.textContent = '点 击 屏 幕 继 续';
  tapHint.style.display = 'block';
}
function pushNextMessage() {
  msgIdx++;
  if (msgIdx >= MESSAGES.length) { finishPhone(); stopAuto(); return; }
  const m = MESSAGES[msgIdx];
  if (m.time) {
    const t = document.createElement('div');
    t.className = 'time-divider';
    t.textContent = m.time;
    phoneChat.appendChild(t);
  }
  if (m.type === 'obj') {
    waitingForObject = true;
    updateTapHint();
    const obj = OBJECTS[m.obj];
    if (!obj) return;
    const card = document.createElement('div');
    card.className = 'msg special show';
    const c = document.createElement('div');
    c.className = 'special-card';
    c.style.animation = 'pulseBorder 1.4s infinite';
    c.innerHTML = `
      <div class="obj-icon">${obj.icon}</div>
      <div class="obj-info">
        <div class="obj-label">${obj.title}</div>
        <div class="obj-main">${obj.main}</div>
        <div class="obj-sub">${obj.sub}</div>
      </div>`;
    c.addEventListener('click', e => {
      e.stopPropagation();
      openDrawer(m.obj, () => {
        c.style.animation = 'none';
        waitingForObject = false;
        updateTapHint();
      });
    });
    card.appendChild(c);
    phoneChat.appendChild(card);
    Audio_.popYou();
    stopAuto();
  } else if (m.sys) {
    const s = document.createElement('div');
    s.className = 'msg show';
    s.style.justifyContent = 'center';
    s.innerHTML = `<div style="font-size:11px;color:#8e8e93;text-align:center;padding:6px 12px;letter-spacing:.5px">${fillName(m.text)}</div>`;
    phoneChat.appendChild(s);
    Audio_.popSys();
  } else {
    const el = document.createElement('div');
    el.className = 'msg ' + m.who;
    el.innerHTML = `<div class="bubble-msg">${fillName(m.text)}</div>`;
    phoneChat.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    if (m.who === 'you') Audio_.popYou(); else Audio_.popMe();
  }
  phoneChat.scrollTop = phoneChat.scrollHeight;
}

let autoTimer = null;
let autoSpeed = 0;
function startAuto() {
  stopAuto();
  if (autoSpeed === 0) return;
  const interval = 900 / autoSpeed;
  autoTimer = setInterval(() => {
    if (phoneFinished) { stopAuto(); return; }
    if (waitingForObject) return;
    if (phoneInputBar.classList.contains('active')) return;
    pushNextMessage();
  }, interval);
}
function stopAuto() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
autoBtn.addEventListener('click', e => {

  autoSpeed = (autoSpeed + 1) % 4;
  autoBtn.textContent = autoSpeed === 0 ? '自动 1x' : `自动 ${autoSpeed}x`;
  autoBtn.classList.toggle('playing', autoSpeed > 0);
  if (autoSpeed === 0) stopAuto(); else startAuto();
});

function buildPositions() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const W = 170, H = 150;
  const cx = vw / 2, cy = vh / 2;
  const positions = [];
  positions.push({ x: cx - W/2, y: cy - H/2 });
  const r2 = Math.min(vw, vh) * 0.22;
  for (let i = 0; i < 6; i++) {
    const a = (Math.PI * 2 / 6) * i - Math.PI / 2;
    positions.push({ x: cx + Math.cos(a) * r2 - W/2, y: cy + Math.sin(a) * r2 - H/2 });
  }
  const r3 = Math.min(vw, vh) * 0.38;
  for (let i = 0; i < 8; i++) {
    const a = (Math.PI * 2 / 8) * i - Math.PI / 2 + Math.PI / 8;
    positions.push({ x: cx + Math.cos(a) * r3 - W/2, y: cy + Math.sin(a) * r3 - H/2 });
  }
  const rx = vw * 0.46;
  const ry = vh * 0.44;
  for (let i = 0; i < 12; i++) {
    const a = (Math.PI * 2 / 12) * i - Math.PI / 2;
    positions.push({ x: cx + Math.cos(a) * rx - W/2, y: cy + Math.sin(a) * ry - H/2 });
  }
  const rx2 = vw * 0.50;
  const ry2 = vh * 0.50;
  for (let i = 0; i < 13; i++) {
    const a = (Math.PI * 2 / 13) * i - Math.PI / 2 + 0.15;
    positions.push({ x: cx + Math.cos(a) * rx2 - W/2, y: cy + Math.sin(a) * ry2 - H/2 });
  }
  return positions.map(p => ({
    x: Math.max(4, Math.min(vw - W - 4, p.x)),
    y: Math.max(40, Math.min(vh - H - 40, p.y)),
  }));
}
let WARN_POSITIONS = [];
async function startWarningScene() {
  Audio_.init();
  warnLayer.classList.add('active');
  warnLayer.innerHTML = '';
  WARN_POSITIONS = buildPositions();
  for (let i = 0; i < WARNINGS.length; i++) {
    const pos = WARN_POSITIONS[i % WARN_POSITIONS.length];
    spawnWarning(WARNINGS[i], pos);
    if (i % 5 === 0) {
      const circleIdx = Math.floor(i / 5);
      Audio_.warnCircle(circleIdx);
    }
    await sleep(520);
  }
  Audio_.finalHit();
  warnLayer.classList.add('final');
  setTimeout(() => warnLayer.classList.remove('final'), 1800);
  await sleep(1400);
  warnLayer.classList.add('black');
  blackout.classList.add('on');
  await sleep(1500);
  warnLayer.innerHTML = '';
  warnLayer.classList.remove('active');
  warnLayer.classList.remove('black');
  startDesktop();
  await sleep(600);
  blackout.classList.remove('on');
}
function spawnWarning(w, pos) {
  const el = document.createElement('div');
  el.className = 'warn-box' + (w.critical ? ' critical' : '');
  el.style.left = pos.x + 'px';
  el.style.top  = pos.y + 'px';
  el.innerHTML = `
    <div class="warn-icon">!</div>
    <div class="warn-title">${w.t}</div>
    <div class="warn-body">${w.b || '&nbsp;'}</div>
  `;
  warnLayer.appendChild(el);
}

const qqApp = document.getElementById('qq-app');
const qqContent = document.getElementById('qq-content');
const qqTitle = document.getElementById('qq-title');
const qqBack = document.getElementById('qq-back');
const qqTabbar = document.getElementById('qq-tabbar');
let qqStack = [];

function openQQ() {
  qqApp.classList.add('active');
  qqStack = [];
  if (!window.__wcPassed) window.__wcPassed = new Set();
  showQQPage('msg');
  Audio_.click();
}
function closeQQ() { qqApp.classList.remove('active'); }
qqBack.addEventListener('click', () => {
  if (qqStack.length > 0) {
    qqStack.pop();
    const prev = qqStack[qqStack.length - 1] || 'msg';
    showQQPage(prev, true);
  } else { closeQQ(); }
  Audio_.click();
});
qqTabbar.addEventListener('click', e => {
  const tab = e.target.closest('.qq-tab');
  if (!tab) return;
  qqTabbar.querySelectorAll('.qq-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  const name = tab.dataset.tab;
  if (name === 'msg') showQQPage('msg');
  else if (name === 'contacts') showQQPage('contacts');
  else if (name === 'space') showQQPage('space');
  else if (name === 'me') showQQPage('me');
  Audio_.click();
});
function showQQPage(name, isBack) {
  qqContent.innerHTML = '';
  switch(name) {
    case 'msg': renderQQMsg(); break;
    case 'contacts': renderQQContacts(); break;
    case 'space': renderQQSpace(); break;
    case 'me': renderQQMe(); break;
    case 'chat-cents': renderQQChatCents(); break;
    case 'chat-chenkai': renderQQChatChenkai(); break;
    case 'chat-group': renderQQChatGroup(); break;
    case 'chat-sys': renderQQChatSys(); break;
    case 'album': renderQQAlbum(); break;
    case 'photo': renderQQPhoto(); break;

const mailApp = document.getElementById('mail-app');

function openMail() {
  mailApp.classList.add('active');

  showMailPage('inbox');
  Audio_.click();
}
function closeMail() { mailApp.classList.remove('active'); }
mailBack.addEventListener('click', () => {
  if (mailStack.length > 0) {
    mailStack.pop();
    const prev = mailStack[mailStack.length - 1] || 'inbox';
    showMailPage(prev, true);
  } else { closeMail(); }
  Audio_.click();
});
mailTabbar.addEventListener('click', e => {
  const tab = e.target.closest('.mail-tab');

  mailTabbar.querySelectorAll('.mail-tab').forEach(t => t.classList.remove('active'));

});

let currentSensitive = null;
let wcBusy = false;

async function triggerSensitive(key) {
  if (window.__wcPassed && window.__wcPassed.has(key)) return;
  if (wcOverlay.classList.contains('active')) return;

  currentSensitive = key;
  wcAsked.innerHTML = '';
  wcOptions.innerHTML = '';
  wcOptions.style.display = 'none';

  const data = SENSITIVE[key];
  const appEl = data.owner === 'wechat' ? wechatApp :
                data.owner === 'qq' ? qqApp :
                data.owner === 'mail' ? mailApp :
                data.owner === 'weibo' ? weiboApp : browserApp;
  appEl.classList.add('shaking');
  Audio_.alertHit();
  setTimeout(() => appEl.classList.remove('shaking'), 520);

  await sleep(600);

  wcOverlay.classList.add('active');
  setTimeout(() => Audio_.askPop(), 200);

  wcBusy = true;
  typeWCLines(data.question.map(t => ({ text: t })), () => {
    wcBusy = false;
    showOptions(data.options);
  });
}

function typeWCLines(lines, done) {
  wcAsked.innerHTML = '';
  let li = 0;
  function next() {
    if (li >= lines.length) { done && done(); return; }
    const item = lines[li];
    const el = document.createElement('span');
    el.className = 'line' + (item.cls ? ' ' + item.cls : '');
    wcAsked.appendChild(el);
    const cur = document.createElement('span');
    cur.className = 'cursor';
    el.appendChild(cur);
    const text = item.text;
    let ci = 0;
    const t = setInterval(() => {
      if (ci >= text.length) {
        clearInterval(t);
        cur.remove(); li++;
        setTimeout(next, 460);
        return;
      }
      cur.insertAdjacentText('beforebegin', text[ci]);
      if (Math.random() < .4) Audio_.key();
      ci++;
    }, 62);
  }
  next();
}

function showOptions(options) {
  wcOptions.innerHTML = '';
  wcOptions.style.display = 'flex';
  options.forEach((opt, i) => {
    const el = document.createElement('div');
    el.className = 'opt';
    el.style.animationDelay = (i * 80) + 'ms';
    el.innerHTML = `<span class="opt-mark">▸</span>${opt.text}`;
    el.addEventListener('click', () => {
      if (wcBusy) return;
      wcBusy = true;
      Audio_.click();
      wcOptions.style.display = 'none';
      wcOptions.innerHTML = '';
      const chosen = document.createElement('span');
      chosen.className = 'line';
      chosen.style.color = '#ff8b8b';
      chosen.style.marginTop = '10px';
      chosen.textContent = '你：' + opt.text;
      wcAsked.appendChild(chosen);
      setTimeout(() => {
        typeWCLines(opt.reply.map(t => ({ text: t, cls: 'dim' })), () => {
          setTimeout(() => {
            wcOverlay.classList.remove('active');
            wcBusy = false;
            afterSensitivePass();
          }, 1100);
        });
      }, 300);
    });
    wcOptions.appendChild(el);
  });
}

    { text: '你真的要和我分手吗。。' },
    { text: '求求你不要丢掉我好不好。' },
  ];

  ceLines.innerHTML = '';
  let li = 0;
  function nextLine() {
    if (li >= lines.length) {
      setTimeout(() => {
        ceBtnWrap.classList.add('show');
        resetBadBtn();
      }, 500);
      return;
    }
    const item = lines[li];
    const el = document.createElement('div');
    if (item.cls) el.className = item.cls;
    ceLines.appendChild(el);
    const cur = document.createElement('span');
    cur.className = 'cursor';
    el.appendChild(cur);
    const text = item.text;
    let ci = 0;
    const timer = setInterval(() => {
      if (ci >= text.length) {
        clearInterval(timer);
        cur.remove(); li++;
        setTimeout(nextLine, 420);
        return;
      }
      cur.insertAdjacentText('beforebegin', text[ci]);
      if (Math.random() < .5) Audio_.key();
      ci++;
    }, item.cls === 'name' ? 150 : 130);
  }
  setTimeout(nextLine, 900);
}

function resetBadBtn() {
  ceBad.classList.remove('escape');
  ceBad.style.left = '';
  ceBad.style.top = '';
  ceBad.style.transform = '';
  ceBad.style.width = '';
  ceBad.style.height = '';
  ceBad.style.fontSize = '';
  ceBad.style.opacity = '1';
  ceBad.style.pointerEvents = 'auto';
  ceTaunt.textContent = '';
  ceBadDodges = 0;
}

function dodgeBadBtn() {
  ceBadDodges++;
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const bw = ceBad.offsetWidth  || 112;
  const bh = ceBad.offsetHeight || 52;
  const pad = 18;
  const goodRect = ceGood.getBoundingClientRect();
  const minX = pad;
  const maxX = vw - bw - pad;
  const minY = 70;
  const maxY = vh - bh - 40;
  let nx = minX, ny = minY, tries = 0;
  while (tries < 40) {
    nx = minX + Math.random() * Math.max(1, maxX - minX);
    ny = minY + Math.random() * Math.max(1, maxY - minY);
    const dx = Math.abs((nx + bw/2) - (goodRect.left + goodRect.width/2));
    const dy = Math.abs((ny + bh/2) - (goodRect.top  + goodRect.height/2));
    if (dx > bw + 60 || dy > bh + 60) break;
    tries++;
  }
  if (!ceBad.classList.contains('escape')) {
    const r = ceBad.getBoundingClientRect();
    ceBad.classList.add('escape');
    ceBad.style.left = r.left + 'px';
    ceBad.style.top  = r.top  + 'px';
    ceBad.style.width = r.width + 'px';
    ceBad.style.height = r.height + 'px';
    void ceBad.offsetWidth;
  }
  ceBad.style.left = nx + 'px';
  ceBad.style.top  = ny + 'px';
  const scale = Math.max(.62, 1 - ceBadDodges * 0.05);
  ceBad.style.transform = `rotate(${(Math.random()*20 - 10)}deg) scale(${scale})`;
  const op = Math.max(.62, 1 - ceBadDodges * 0.04);
  ceBad.style.opacity = op;
  ceTaunt.textContent = CE_TAUNTS[(ceBadDodges - 1) % CE_TAUNTS.length];
  Audio_.wrong();
  if (navigator.vibrate) { try { navigator.vibrate(40); } catch(e) {} }
}

ceBad.addEventListener('click', e => {
  e.preventDefault();
  e.stopPropagation();
  dodgeBadBtn();
});

ceGood.addEventListener('click', () => {
  if (ceGood.dataset.done === '1') return;
  ceGood.dataset.done = '1';
  Audio_.celebrate();
  if (navigator.vibrate) { try { navigator.vibrate([40,30,40,30,120]); } catch(e) {} }
  centsEnd.style.transition = 'opacity .5s';
  centsEnd.style.opacity = '0';
  setTimeout(() => {
    centsEnd.classList.remove('active');
    centsEnd.style.opacity = '';
    centsEnd.style.transition = '';
    startCelebrate();
  }, 500);
});

/* ============================================================
   21. 庆祝动画：红色心跳脉冲 + 粒子爆发
   ============================================================ */
const ceCelebrate = document.getElementById('ce-celebrate');
const ceCanvas = document.getElementById('ce-canvas');
const ceCelText = document.getElementById('ce-cel-text');
let ceRAF = null;

function drawHeart(ctx, x, y, size, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.beginPath();
  const s = size;
  ctx.moveTo(0, s * 0.42);
  ctx.bezierCurveTo( s * 1.05, -s * 0.38,  s * 0.42, -s * 1.35, 0, -s * 0.55);
  ctx.bezierCurveTo(-s * 0.42, -s * 1.35, -s * 1.05,  -s * 0.38, 0, s * 0.42);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function startCelebrate() {
  ceCelebrate.classList.add('active');
  ceCelText.classList.remove('show');
  resizeCECanvas();
  window.addEventListener('resize', resizeCECanvas);

  const ctx = ceCanvas.getContext('2d');
  const W = () => window.innerWidth;
  const H = () => window.innerHeight;
  let cx = W() / 2;
  let cy = H() / 2;
  const MAX_R = Math.min(W(), H()) * 0.32;

  const COLORS = ['#ff2b2b','#ff1744','#ff0055','#ff5c5c','#ff8b8b','#ffd0d0','#c41e2c'];

  const rings = [];
  const particles = [];
  const floatHearts = [];
  const sparks = [];

  function spawnParticle(angle, speed, size, color, life, shape) {
    return {
      x: cx, y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size, color, life, maxLife: life,
      spin: Math.random() * Math.PI * 2,
      spinSpeed: (Math.random() - .5) * .25,
      shape,
    };
  }

  function bigBurst(count, baseSpeed) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = baseSpeed * (0.4 + Math.random() * 0.9);
      particles.push(spawnParticle(
        a, s,
        3 + Math.random() * 4,
        COLORS[Math.floor(Math.random() * COLORS.length)],
        70 + Math.random() * 60,
        Math.random() < 0.32 ? 'heart' : 'dot'
      ));
    }
  }

  function heartbeatPulse() {
    rings.push({ r: 8, max: MAX_R * 1.25, life: 60, maxLife: 60, w: 6, bright: 1 });
    rings.push({ r: 4, max: MAX_R * 1.05, life: 55, maxLife: 55, w: 2, bright: .7 });
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 1.6 + Math.random() * 2.4;
      sparks.push({
        x: cx, y: cy,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: 26, maxLife: 26,
        size: 1.5 + Math.random() * 2,
        color: COLORS[Math.floor(Math.random()*COLORS.length)],
      });
    }
  }

  heartbeatPulse();
  bigBurst(140, 3.4);
  Audio_.heartbeat(0.14);

  let frame = 0;
  const heartChars = ['♥','❤','♡','💗'];

  function loop() {
    frame++;
    ctx.fillStyle = 'rgba(5,5,6,0.22)';
    ctx.fillRect(0, 0, W(), H());

    const beat = Math.sin(frame * 0.16);
    const beatStrong = Math.max(0, beat) ** 2;
    const haloR = MAX_R * (0.9 + beatStrong * 0.25);

    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, haloR);
    g.addColorStop(0,    'rgba(255,60,60,' + (0.28 + beatStrong * 0.22) + ')');
    g.addColorStop(0.35, 'rgba(200,0,30,' + (0.14 + beatStrong * 0.12) + ')');
    g.addColorStop(0.7,  'rgba(120,0,20,0.05)');
    g.addColorStop(1,    'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W(), H());

    const coreR = 14 + beatStrong * 18;
    const coreG = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR);
    coreG.addColorStop(0,   'rgba(255,255,255,' + (0.55 + beatStrong * 0.35) + ')');
    coreG.addColorStop(0.4, 'rgba(255,80,80,' + (0.5 + beatStrong * 0.3) + ')');
    coreG.addColorStop(1,   'rgba(255,43,43,0)');
    ctx.fillStyle = coreG;
    ctx.beginPath();
    ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
    ctx.fill();

    for (let i = rings.length - 1; i >= 0; i--) {
      const rg = rings[i];
      rg.r += (rg.max - rg.r) * 0.06 + 1.4;
      rg.life--;
      const alpha = Math.max(0, rg.life / rg.maxLife);
      const a = alpha * rg.bright;
      ctx.save();
      ctx.shadowColor = 'rgba(255,43,43,' + (a * 0.95) + ')';
      ctx.shadowBlur = 24 * a + 6;
      ctx.beginPath();
      ctx.arc(cx, cy, rg.r, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,60,60,' + (a * 0.9) + ')';
      ctx.lineWidth = rg.w * (0.4 + alpha * 0.9);
      ctx.stroke();
      ctx.restore();
      if (rg.life <= 0 || rg.r > rg.max) rings.splice(i, 1);
    }

    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx; s.y += s.vy;
      s.vx *= 0.92; s.vy *= 0.92;
      s.life--;
      const a = Math.max(0, s.life / s.maxLife);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = s.color;
      ctx.shadowColor = s.color;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      if (s.life <= 0) sparks.splice(i, 1);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.965; p.vy *= 0.965;
      p.vy += 0.035;
      p.spin += p.spinSpeed;
      p.life--;
      const alpha = Math.max(0, p.life / p.maxLife);
      const dist = Math.hypot(p.x - cx, p.y - cy);
      const edge = Math.min(1, Math.max(0, 1 - (dist - MAX_R) / (MAX_R * 0.45)));
      const a = alpha * edge;

      if (a > 0.02) {
        ctx.save();
        ctx.globalAlpha = a;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 16;
        if (p.shape === 'heart') {
          drawHeart(ctx, p.x, p.y, p.size * 1.6, p.spin);
        } else {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
      if (p.life <= 0 || dist > MAX_R * 1.6) particles.splice(i, 1);
    }

    if (frame % 50 === 1 && frame < 280) {
      heartbeatPulse();
      bigBurst(38, 3.2);
      Audio_.heartbeat(0.1);
    }

    if (frame % 40 === 0 && frame < 260) {
      for (let k = 0; k < 7; k++) {
        const a0 = Math.random() * Math.PI * 2;
        const r0 = Math.random() * MAX_R * 0.4;
        floatHearts.push({
          x: cx + Math.cos(a0) * r0,
          y: cy + Math.sin(a0) * r0 + MAX_R * 0.1,
          vx: Math.cos(a0) * 0.4,
          vy: -0.6 - Math.random() * 0.8,
          size: 14 + Math.random() * 12,
          life: 115,
          maxLife: 115,
          rot: (Math.random() - 0.5) * 0.7,
          ch: heartChars[Math.floor(Math.random() * heartChars.length)],
          wobble: Math.random() * Math.PI * 2,
        });
      }
    }

    for (let i = floatHearts.length - 1; i >= 0; i--) {
      const h = floatHearts[i];
      h.wobble += 0.08;
      h.x += h.vx + Math.sin(h.wobble) * 0.35;
      h.y += h.vy;
      h.life--;
      const alpha = Math.max(0, h.life / h.maxLife);
      const dist = Math.hypot(h.x - cx, h.y - cy);
      const edge = Math.min(1, Math.max(0, 1 - (dist - MAX_R) / (MAX_R * 0.4)));
      const a = alpha * edge;

      if (a > 0.02) {
        ctx.save();
        ctx.globalAlpha = a * 0.95;
        ctx.translate(h.x, h.y);
        ctx.rotate(Math.sin(h.wobble) * 0.15 + h.rot * 0.3);
        ctx.fillStyle = '#ff2b2b';
        ctx.shadowColor = '#ff1744';
        ctx.shadowBlur = 18;
        ctx.font = h.size + 'px serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(h.ch, 0, 0);
        ctx.globalAlpha = a * 0.5;
        ctx.fillStyle = '#ffd0d0';
        ctx.shadowBlur = 0;
        ctx.font = (h.size * 0.9) + 'px serif';
        ctx.fillText(h.ch, -h.size * 0.12, -h.size * 0.12);
        ctx.restore();
      }
      if (h.life <= 0 || dist > MAX_R * 1.5) floatHearts.splice(i, 1);
    }

    ceRAF = requestAnimationFrame(loop);
  }
  loop();

  setTimeout(() => ceCelText.classList.add('show'), 450);

  setTimeout(() => {
    if (ceRAF) cancelAnimationFrame(ceRAF);
    ceRAF = null;
    window.removeEventListener('resize', resizeCECanvas);
    ceCelebrate.style.transition = 'opacity .9s';
    ceCelebrate.style.opacity = '0';
    setTimeout(() => {
      ceCelebrate.classList.remove('active');
      ceCelebrate.style.opacity = '';
      ceCelebrate.style.transition = '';
      ceCelText.classList.remove('show');
      restoreDesktopAfterEnding();
    }, 900);
  }, 5200);
}

function resizeCECanvas() {
  if (!ceCanvas) return;
  const dpr = window.devicePixelRatio || 1;
  ceCanvas.width = window.innerWidth * dpr;
  ceCanvas.height = window.innerHeight * dpr;
  ceCanvas.style.width = window.innerWidth + 'px';
  ceCanvas.style.height = window.innerHeight + 'px';
  const ctx = ceCanvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

/* ============================================================
   22. 桌面恢复原样（保持全部解锁）
   ============================================================ */
function restoreDesktopAfterEnding() {
  appStatus.wechat = 'done';
  appStatus.qq = 'done';
  appStatus.mail = 'done';
  appStatus.weibo = 'done';
  appStatus.browser = 'done';
  renderDesktop();
  desktopEl.classList.add('active');
  taskbarEl.classList.add('active');
  setTimeout(() => {
    showSysToast('Cents 已住进你的手机。他会一直在。');
  }, 600);
}

globalSkip.addEventListener('click', e => {

  wcOverlay.classList.remove('active');
  wechatApp.classList.remove('active');
  qqApp.classList.remove('active');
  mailApp.classList.remove('active');
  weiboApp.classList.remove('active');
  browserApp.classList.remove('active');
  phoneEl.classList.remove('active');
  warnLayer.classList.remove('active');
  warnLayer.classList.remove('black');

  document.getElementById('sys-toast-layer').classList.remove('show');
  drawer.classList.remove('open');
  drawerBackdrop.classList.remove('open');
  monologueEl.classList.remove('active');
  nameScreen.classList.remove('fade');
  stopAuto();
  globalSkip.classList.remove('show');
  ceEndingDone = false;
  startCentsEnding();
});

function syncGlobalSkip() {
  const shouldShow =
    desktopEl.classList.contains('active') &&
    !centsEnd.classList.contains('active') &&
    !ceCelebrate.classList.contains('active') &&
    !globalSkipDone;
  globalSkip.classList.toggle('show', shouldShow);
}
setInterval(syncGlobalSkip, 400);
